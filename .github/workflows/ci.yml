name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CGO_ENABLED: 1

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validator dependencies
        run: python -m pip install -r contracts/requirements.txt

      - name: Validate contracts
        run: python contracts/validate.py

      - name: Test contract validator
        run: python -m unittest -v contracts/test_validate.py

      - name: Test usage evaluation scripts
        run: python -B -m unittest discover -s scripts -v

      - name: Verify frozen localisation set
        run: python spikes/localisation/freeze.py

      - name: Verify localisation provenance of the frozen set
        run: |
          python spikes/localisation/verify_provenance.py
          python -m unittest -v spikes/localisation/test_verify_provenance.py

      - name: Check VEX consistency on the S6-08 run
        run: |
          python spikes/vex-format/s6-08/consistency.py spikes/vex-format/s6-08/results --check > /dev/null
          python -m unittest -v spikes/vex-format/s6-08/test_consistency.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Versions come from scripts/versions.env, the same pins the demo uses.
      - name: Install golangci-lint and govulncheck
        run: |
          . scripts/versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Verify localisation provenance with the tool (offline)
        run: go run ./cmd/sbomber localise --verify spikes/localisation/results/provenance/localisation.json

  # The integrated pipeline on the pinned demo repository (#121, #146):
  # scan -> usage, localise -> decide -> report, vex, run twice from a clean
  # checkout. The two runs must be identical, and every contract file must
  # pass contracts/validate.py.
  pipeline:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CGO_ENABLED: 1
      # localise's advisory and patch lookups; unauthenticated, GitHub
      # allows 60 requests an hour, fewer than one run makes.
      GITHUB_TOKEN: ${{ github.token }}
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract validator dependencies
        run: python -m pip install -r contracts/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the pinned tools
        run: scripts/install-tools.sh

      - name: Run the demonstration twice
        run: scripts/demo.sh --twice

      - name: Upload the demonstration artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-artefacts
          path: demo-out/run
          if-no-files-found: warn
